services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: route_user
      POSTGRES_PASSWORD: ваш_пароль
      POSTGRES_DB: route_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://route_user:ваш_пароль@db:5432/route_db
    depends_on:
      - db

volumes:
  postgres_data:
