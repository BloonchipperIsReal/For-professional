<!DOCTYPE html>
<html>
<head>
    <title>GPX на карте</title>
    <script src="https://openlayers.org/api/OpenLayers.js"></script>
    <style>
        html, body, #map { width: 100%; height: 100%; margin: 0; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = new OpenLayers.Map("map");
        map.addLayer(new OpenLayers.Layer.OSM());

        var trackLayer = new OpenLayers.Layer.Vector("Track", {
            protocol: new OpenLayers.Protocol.HTTP({
                url: "test.gpx", // Положите тестовый файл рядом с HTML
                format: new OpenLayers.Format.GPX({
                    extractWaypoints: true,
                    extractName: true,
                    extractRoutes: true,
                    extractAttributes: true
                })
            }),
            strategies: [new OpenLayers.Strategy.Fixed()],
            projection: new OpenLayers.Projection("EPSG:4326"),
            style: { strokeColor: "#33aaff", strokeWidth: 3 }
        });
        map.addLayer(trackLayer);

        trackLayer.events.register("loadend", trackLayer, function() {
            map.zoomToExtent(trackLayer.getDataExtent());
        });
    </script>
</body>
</html>
